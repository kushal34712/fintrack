
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>FinTrack Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Premium App Animations */
        @keyframes slideInRight {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideUpPop {
            from { transform: translateY(40px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes calendarSquish {
            0% { transform: scale(1); }
            30% { transform: scale(0.92, 0.96); }
            60% { transform: scale(1.04, 1.02); }
            100% { transform: scale(1); }
        }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 0px rgba(99, 102, 241, 0); }
            50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
            100% { box-shadow: 0 0 0px rgba(99, 102, 241, 0); }
        }

        .animate-tab-entry { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .animate-card-pop { animation: slideUpPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out both; }
        .animate-calendar-active { animation: calendarSquish 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .calendar-glow { animation: glowPulse 2s infinite ease-in-out; }

        .date-input-overlay::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: auto; height: auto;
            color: transparent;
            background: transparent;
            cursor: pointer;
        }

        @media print {
            nav, header button, .fixed, .no-print {
                display: none !important;
            }
            body { background: white !important; color: black !important; }
            main { margin: 0 !important; padding: 20px !important; max-width: 100% !important; }
            .animate-tab-entry, .animate-card-pop { animation: none !important; opacity: 1 !important; transform: none !important; }
        }
    </style>
<script type="importmap">

}

</head>

<script type="module" src="/index.tsx"></script>
</body>
</html>
